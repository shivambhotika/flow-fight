<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Fight — Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Figtree:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    html, body { overflow: auto; background: var(--lumen); color: var(--vast); }
    body { padding: 40px; display: block; }
    .lb-page-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 32px; }
    .lb-page-title {
      font-family: 'EB Garamond', serif;
      font-size: 56px; font-weight: 400; letter-spacing: -0.05em; line-height: 0.9;
      color: var(--vast);
    }
    .lb-page-title span { color: var(--fathom); }
    .lb-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .lb-tab {
      padding: 8px 18px; border-radius: var(--r-pill);
      font-size: 13px; font-weight: 600;
      background: transparent; border: 2px solid var(--border);
      color: var(--text-dim); cursor: pointer; transition: all .15s;
    }
    .lb-tab:hover  { border-color: var(--vast); color: var(--vast); }
    .lb-tab.active { background: var(--vast); border-color: var(--vast); color: var(--lumen); }
    .lb-full-row {
      display: grid;
      grid-template-columns: 40px 1fr auto 120px 80px;
      align-items: center; gap: 16px;
      padding: 14px 20px;
      background: var(--lumen); border: 2px solid var(--border);
      border-radius: var(--r-md); font-size: 15px;
    }
    .lb-full-row.top-1 { border-color: var(--fathom); }
    .lb-full-row.top-2 { border-color: var(--text-dimmer); }
    .lb-full-row.top-3 { border-color: var(--glow); }
    .lb-full-list { display: flex; flex-direction: column; gap: 8px; max-width: 900px; }
    .lb-empty { font-size: 14px; color: var(--text-dim); padding: 40px 0; text-align: center; }
    .live-banner {
      display: flex; align-items: center; gap: 16px;
      background: var(--fathom); border: 2px solid var(--vast);
      border-radius: var(--r-lg); padding: 16px 24px;
      margin-bottom: 24px; max-width: 900px; color: var(--lumen);
    }
    .live-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); animation: voicepulse 1s ease infinite; flex-shrink: 0; }
    @keyframes voicepulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(0.7)} }
    .live-text { font-size: 14px; color: rgba(255,255,235,.7); flex: 1; }
    .live-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .live-stat { font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; color: var(--lumen); }
    .live-lbl  { font-size: 10px; color: rgba(255,255,235,.5); text-transform: uppercase; letter-spacing: 0.08em; }
  </style>
</head>
<body>

<div class="lb-page-header">
  <div class="lb-page-title">FLOW <span>FIGHT</span></div>
  <div class="dim text-sm" id="event-name-label">Leaderboard</div>
</div>

<div class="live-banner" id="live-banner" style="display:none">
  <div class="live-dot"></div>
  <div class="live-text" id="live-text">Race in progress</div>
  <div class="live-col" style="margin:0 12px">
    <div class="live-stat" id="live-s1-wpm">—</div>
    <div class="live-lbl" id="live-s1-label">Station 1</div>
  </div>
  <div style="width:1px;height:32px;background:rgba(255,255,235,.2)"></div>
  <div class="live-col" style="margin:0 12px">
    <div class="live-stat" id="live-s2-wpm">—</div>
    <div class="live-lbl" id="live-s2-label">Station 2</div>
  </div>
</div>

<div class="lb-tabs" id="lb-tabs"></div>
<div class="lb-full-list" id="lb-full-list"></div>

<script src="/leaderboard.js"></script>
</body>
</html>
